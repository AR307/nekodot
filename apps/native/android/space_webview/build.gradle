// flutter_inappwebview 6.1.5 / Android 1.1.3, built with this app's AGP 9.
// Keep the upstream Java/resources and dependency versions. The published
// Gradle file requests the removed proguard-android.txt; use current library
// configuration without changing the shared Pub cache or downgrading AGP.
apply plugin: 'com.android.library'
def upstream = gradle.ext.spaceWebViewSource

android {
    namespace 'com.pichillilorenzo.flutter_inappwebview_android'
    compileSdk 36
    defaultConfig {
        minSdk 29
        consumerProguardFiles new File(upstream, 'proguard-rules.pro')
        vectorDrawables.useSupportLibrary = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        manifest.srcFile new File(upstream, 'src/main/AndroidManifest.xml')
        java.srcDirs = [new File(upstream, 'src/main/java')]
        res.srcDirs = [new File(upstream, 'src/main/res')]
        assets.srcDirs = [new File(upstream, 'src/main/assets')]
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
